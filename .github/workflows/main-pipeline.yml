name: CI/CD pipeline thực tế
#chạy tự động khi có code đẩy lên nhánh main
on:
    push: 
        branches: ["main"]
jobs:
    # công việc đầu tiên kiếm tra code (line & test)
    test-stage:
        runs-on: ubuntu-latest
        steps:
            - name: lấy code từ github về
              uses: actions/checkout@v4
            - name: giả lập quá trình dọn dẹp
              run: echo " Linting code sạch đẹp không có lỗi cú pháp"
            - name: giả lập quá trình chạy thử nghiệm (unit test)
              run: echo "unit test các chức năng đều chạy tốt"
    build-and-deploy-stage:
        # bắt buộc công việc 1 thành công mới có thể chạy tiếp cái này
        needs: test-stage
        runs-on: ubuntu-latest
        steps:
          - name: Lấy code từ GitHub về
            uses: actions/checkout@v4

          - name: Đóng gói thành Docker Image
            run: docker build -t ${{secrets.DOCKER_USERNAME}}/demo-app:v1.

            # BƯỚC QUÉT BẢO MẬT (TRIVY)
          - name: Gọi bảo vệ Trivy quét lỗ hổng bảo mật
            uses: aquasecurity/trivy-action@master
            with:
                image-ref: '${{ secrets.DOCKER_USERNAME }}/demo-app:v1'
                format: 'table'
                # Tạm thời để exit-code: '0' để người mới không bị fail quy trình
                exit-code: '0' 
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'

        # BƯỚC ĐĂNG NHẬP VÀ ĐẨY LÊN (PUSH)
          - name: Đăng nhập vào Docker Hub bằng chìa khóa (Secrets)
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

          - name: Vận chuyển (Push) Image lên Docker Hub
            run: docker push ${{ secrets.DOCKER_USERNAME }}/demo-app:v1
